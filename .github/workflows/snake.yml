name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/snake-dark.svg?palette=github-dark&color_snake=${{ '#39D353' }}
            output/snake-light.svg?palette=github-light&color_snake=${{ '#39D353' }}
      - uses: EndBug/add-and-commit@v9
        with:
          message: "chore: refresh contribution snake"
          add: "output"