<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krishna Magar | Profile README preview</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #24292f; background: #f6f8fa; }
    body { margin: 0; padding: 32px 16px; }
    main { max-width: 900px; margin: auto; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: #57606a; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
    section { padding: 18px; border: 1px solid #d0d7de; border-radius: 10px; background: #fff; }
    section.dark { color: #e6edf3; background: #0d1117; border-color: #30363d; }
    section.dark p { color: #8b949e; }
    img { display: block; width: 100%; height: auto; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Profile visual preview</h1>
    <p>Generated assets shown in both supported GitHub themes.</p>
    <div class="grid">
      <section><strong>Light theme</strong><img src="assets/radar-light.svg" alt="Light skill radar"><img src="assets/languages-radar-light.svg" alt="Light language radar"><img src="assets/project-1-light.svg" alt="Light project card"></section>
      <section class="dark"><strong>Dark theme</strong><img src="assets/radar-dark.svg" alt="Dark skill radar"><img src="assets/languages-radar-dark.svg" alt="Dark language radar"><img src="assets/project-1-dark.svg" alt="Dark project card"></section>
    </div>
  </main>
</body>
</html>
