name: Generate contribution snake

on:
  workflow_dispatch:

  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: 2400030948
          outputs: |
            output/github-contribution-grid-snake.svg?palette=github-light&color_snake=%2339D353
            output/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2339D353

      - name: push snake output to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}